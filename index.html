<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>理科問題解決ナビ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================
   理科問題解決ナビ
   ============================================ */

:root {
  /* ベース */
  --bg: #fffaf0;
  --bg-paper: #fff;
  --ink: #2b2b3d;
  --ink-soft: #5a5a72;
  --line: #2b2b3d;
  --muted: #d8d3c4;

  /* アクセント */
  --accent: #ffd84d;
  --accent-2: #ff7d6b;

  /* ステップカラー（8色） */
  --c1: #5BA8E8;  /* 何を調べる */
  --c2: #B57AE0;  /* どうなると思う */
  --c3: #FF9D4D;  /* どうやって調べる */
  --c4: #FF6B6B;  /* 実験する */
  --c5: #5FCB8B;  /* 整理する */
  --c6: #4A6FB8;  /* 結果から考える */
  --c7: #FF85B5;  /* 伝える */
  --c8: #6CCED0;  /* ふり返る */

  /* シャドウ */
  --shadow-sm: 3px 3px 0 var(--line);
  --shadow-md: 5px 5px 0 var(--line);
  --shadow-lg: 7px 7px 0 var(--line);

  /* 字 */
  --font-display: "Zen Maru Gothic", "Kosugi Maru", system-ui, sans-serif;
  --font-body: "Kosugi Maru", "Zen Maru Gothic", system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--bg);
  background-image:
    radial-gradient(circle at 20% 10%, rgba(255, 216, 77, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(255, 125, 107, 0.10) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(91, 168, 232, 0.08) 0%, transparent 60%);
  min-height: 100vh;
  line-height: 1.7;
  font-weight: 500;
  letter-spacing: 0.02em;
}

/* ノート風グリッド背景 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(43, 43, 61, 0.04) 1px, transparent 1px);
  background-size: 100% 28px;
  pointer-events: none;
  z-index: 0;
}

main, header { position: relative; z-index: 1; }

/* ============================================
   ヘッダー
   ============================================ */
header {
  padding: 24px 20px 16px;
  text-align: center;
}

.logo-row {
  display: inline-flex;
  align-items: baseline;
  gap: 10px;
  background: var(--bg-paper);
  padding: 12px 24px;
  border: 3px solid var(--line);
  border-radius: 24px 4px 24px 4px;
  box-shadow: var(--shadow-md);
  transform: rotate(-1deg);
  margin-bottom: 8px;
}

h1.title {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(22px, 5vw, 32px);
  letter-spacing: 0.08em;
  color: var(--ink);
}

.title-mark {
  display: inline-block;
  font-size: 0.7em;
  background: var(--accent);
  border: 2px solid var(--line);
  padding: 2px 8px;
  border-radius: 6px;
  transform: translateY(-4px);
}

.subtitle {
  color: var(--ink-soft);
  font-size: clamp(13px, 3vw, 15px);
  margin-top: 4px;
}

/* ============================================
   メインレイアウト
   ============================================ */
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 8px 16px 60px;
}

/* ============================================
   今日の学習
   ============================================ */
.today-board {
  background: var(--bg-paper);
  border: 3px solid var(--line);
  border-radius: 16px;
  padding: 18px 20px;
  margin-bottom: 28px;
  box-shadow: var(--shadow-md);
  position: relative;
}

.today-board::before {
  content: "📌";
  position: absolute;
  top: -16px;
  left: 24px;
  font-size: 28px;
  background: var(--accent);
  border: 3px solid var(--line);
  border-radius: 50%;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

.today-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-soft);
  letter-spacing: 0.12em;
  margin-left: 56px;
  margin-bottom: 6px;
}

.today-board .field-row {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 8px 14px;
  align-items: start;
  margin-top: 8px;
}

.today-board .field-label {
  font-weight: 700;
  color: var(--ink-soft);
  font-size: 14px;
  padding-top: 2px;
}

.today-board .field-value {
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  word-break: break-word;
}

.today-edit-btn {
  position: absolute;
  top: 14px;
  right: 14px;
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: 10px;
  padding: 6px 12px;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--line);
  transition: transform 0.1s;
}
.today-edit-btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--line); }
.today-edit-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--line); }

/* ============================================
   進捗バー
   ============================================ */
.progress-section {
  margin-bottom: 24px;
}

.progress-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-soft);
  margin-bottom: 8px;
  text-align: center;
  letter-spacing: 0.1em;
}

.progress-bar {
  display: flex;
  gap: 4px;
  justify-content: center;
  flex-wrap: wrap;
}

.progress-dot {
  width: 28px;
  height: 28px;
  border: 2.5px solid var(--line);
  border-radius: 50%;
  background: var(--bg-paper);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 900;
  color: var(--ink-soft);
  position: relative;
  transition: all 0.2s;
}

.progress-dot.in-progress {
  background: var(--accent);
  transform: scale(1.15);
  box-shadow: 2px 2px 0 var(--line);
}

.progress-dot.done {
  background: var(--c5);
  color: white;
}

.progress-dot.done::after {
  content: "✓";
  position: absolute;
  font-size: 14px;
}
.progress-dot.done { font-size: 0; }

/* ============================================
   セクションタイトル
   ============================================ */
.section-title {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(18px, 4.5vw, 22px);
  text-align: center;
  margin: 32px 0 20px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}

.section-title::before,
.section-title::after {
  content: "";
  display: inline-block;
  width: 30px;
  height: 3px;
  background: var(--ink);
}

/* ============================================
   ステップカードグリッド
   ============================================ */
.steps-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

@media (max-width: 900px) {
  .steps-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 480px) {
  .steps-grid { grid-template-columns: 1fr; }
}

.step-card {
  background: var(--bg-paper);
  border: 3px solid var(--line);
  border-radius: 16px;
  padding: 16px 14px 14px;
  cursor: pointer;
  text-align: center;
  position: relative;
  box-shadow: var(--shadow-md);
  transition: transform 0.12s, box-shadow 0.12s;
  font-family: var(--font-body);
}

.step-card:hover {
  transform: translate(-2px, -2px);
  box-shadow: 7px 7px 0 var(--line);
}

.step-card:active {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 var(--line);
}

.step-number {
  position: absolute;
  top: -12px;
  left: -10px;
  width: 32px;
  height: 32px;
  background: var(--card-color, var(--accent));
  color: white;
  border: 3px solid var(--line);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 14px;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
}

.step-status {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 10px;
  border: 2px solid var(--line);
  background: var(--bg);
  letter-spacing: 0.05em;
}

.step-status.in-progress { background: var(--accent); }
.step-status.done { background: var(--c5); color: white; }

.step-icon {
  font-size: 38px;
  display: block;
  margin: 12px 0 4px;
  filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.08));
}

.step-title {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 16px;
  margin: 6px 0 4px;
  letter-spacing: 0.03em;
}

.step-desc {
  font-size: 12px;
  color: var(--ink-soft);
  line-height: 1.5;
  min-height: 2.5em;
}

.step-card[data-step="1"] { --card-color: var(--c1); }
.step-card[data-step="2"] { --card-color: var(--c2); }
.step-card[data-step="3"] { --card-color: var(--c3); }
.step-card[data-step="4"] { --card-color: var(--c4); }
.step-card[data-step="5"] { --card-color: var(--c5); }
.step-card[data-step="6"] { --card-color: var(--c6); }
.step-card[data-step="7"] { --card-color: var(--c7); }
.step-card[data-step="8"] { --card-color: var(--c8); }

/* カード上部のカラーバー */
.step-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 8px;
  background: var(--card-color);
  border-radius: 13px 13px 0 0;
}

/* ============================================
   詳細パネル（モーダル風）
   ============================================ */
.detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(43, 43, 61, 0.5);
  display: none;
  align-items: flex-start;
  justify-content: center;
  z-index: 100;
  overflow-y: auto;
  padding: 20px 12px;
}

.detail-overlay.active {
  display: flex;
  animation: fadeIn 0.2s;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.detail-panel {
  background: var(--bg-paper);
  border: 3px solid var(--line);
  border-radius: 20px;
  max-width: 720px;
  width: 100%;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
  animation: slideUp 0.25s ease-out;
}

@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.detail-header {
  background: var(--panel-color, var(--accent));
  padding: 20px 60px 20px 24px;
  border-bottom: 3px solid var(--line);
  position: relative;
}

.detail-header-row {
  display: flex;
  align-items: center;
  gap: 14px;
}

.detail-icon {
  font-size: 44px;
  background: var(--bg-paper);
  border: 3px solid var(--line);
  border-radius: 50%;
  width: 68px;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 3px 3px 0 var(--line);
}

.detail-step-num {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink);
  background: var(--bg-paper);
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  border: 2px solid var(--line);
  margin-bottom: 4px;
  letter-spacing: 0.1em;
}

.detail-title {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(20px, 4.5vw, 26px);
  color: white;
  text-shadow: 2px 2px 0 var(--line);
  letter-spacing: 0.04em;
}

.detail-teacher-word {
  font-size: 12px;
  color: var(--ink);
  margin-top: 4px;
  opacity: 0.7;
}

.close-btn {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--bg-paper);
  border: 3px solid var(--line);
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 2px 2px 0 var(--line);
  font-family: var(--font-body);
}
.close-btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--line); }
.close-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--line); }

.detail-body {
  padding: 24px;
  max-height: 70vh;
  overflow-y: auto;
}

/* status切り替えバー */
.status-switcher {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
  background: var(--bg);
  padding: 6px;
  border: 2px solid var(--line);
  border-radius: 12px;
}

.status-switcher button {
  flex: 1;
  padding: 8px 4px;
  border: 2px solid transparent;
  border-radius: 8px;
  background: transparent;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  color: var(--ink-soft);
}

.status-switcher button.active {
  background: var(--panel-color, var(--accent));
  color: white;
  border-color: var(--line);
  box-shadow: 2px 2px 0 var(--line);
  text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
}

/* セクションブロック */
.block {
  margin-bottom: 22px;
}

.block-title {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 6px;
  border-bottom: 3px dotted var(--muted);
}

.block-emoji {
  font-size: 22px;
}

.thinking-list,
.hint-list {
  list-style: none;
  padding: 0;
}

.thinking-list li,
.hint-list li {
  padding: 8px 14px;
  margin-bottom: 6px;
  background: var(--bg);
  border: 2px solid var(--muted);
  border-radius: 10px;
  font-size: 14px;
  position: relative;
  padding-left: 32px;
}

.thinking-list li::before {
  content: "💭";
  position: absolute;
  left: 8px;
  top: 7px;
}

.hint-list li::before {
  content: "💡";
  position: absolute;
  left: 8px;
  top: 7px;
}

/* 文型入力エリア */
.frame-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.frame-item {
  background: var(--bg);
  border: 2px solid var(--muted);
  border-radius: 10px;
  padding: 12px;
}

.frame-template {
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 8px;
  background: white;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px dashed var(--muted);
}

.frame-input {
  width: 100%;
  min-height: 56px;
  padding: 10px;
  border: 2px solid var(--line);
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 14px;
  resize: vertical;
  background: white;
  line-height: 1.6;
}

.frame-input:focus {
  outline: none;
  background: #fffcf0;
  box-shadow: 2px 2px 0 var(--line);
}

.frame-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  justify-content: flex-end;
  flex-wrap: wrap;
}

.btn {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 13px;
  padding: 8px 16px;
  border: 2px solid var(--line);
  border-radius: 10px;
  background: var(--bg-paper);
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--line);
  transition: transform 0.1s;
}

.btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--line); }
.btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--line); }

.btn-primary { background: var(--accent); }
.btn-copy { background: var(--c8); color: white; text-shadow: 1px 1px 0 rgba(0,0,0,0.2); }

.save-notice {
  font-size: 12px;
  color: var(--c5);
  font-weight: 700;
  margin-top: 6px;
  text-align: right;
  min-height: 1em;
}

/* ツールリスト */
.tool-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
@media (max-width: 540px) { .tool-list { grid-template-columns: 1fr; } }

.tool-card {
  background: white;
  border: 2px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  position: relative;
}

.tool-name {
  font-weight: 900;
  font-size: 14px;
  margin-bottom: 4px;
}

.tool-desc {
  font-size: 12px;
  color: var(--ink-soft);
  line-height: 1.4;
}

.tool-status {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 6px;
  border: 1.5px solid var(--line);
  background: var(--muted);
}

/* ============================================
   結果vs考察ミニチェック（Step5,6専用）
   ============================================ */
.fact-check {
  background: linear-gradient(135deg, #fff 0%, #fff8e8 100%);
  border: 3px dashed var(--c6);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 22px;
}

.fact-check-title {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 15px;
  margin-bottom: 6px;
  color: var(--c6);
}

.fact-check-desc {
  font-size: 12px;
  color: var(--ink-soft);
  margin-bottom: 12px;
}

.fact-quiz {
  background: white;
  border: 2px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
}

.fact-quiz-text {
  font-size: 14px;
  margin-bottom: 10px;
  font-weight: 700;
  line-height: 1.5;
}

.fact-buttons {
  display: flex;
  gap: 8px;
}

.fact-btn {
  flex: 1;
  padding: 10px 8px;
  border: 2px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--line);
}
.fact-btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--line); }
.fact-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--line); }

.fact-btn.fact { background: var(--c1); color: white; text-shadow: 1px 1px 0 rgba(0,0,0,0.2); }
.fact-btn.opinion { background: var(--c2); color: white; text-shadow: 1px 1px 0 rgba(0,0,0,0.2); }

.fact-feedback {
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  display: none;
}
.fact-feedback.correct { background: #e6f7ed; color: #1e7e44; border: 2px solid #5fcb8b; display: block; }
.fact-feedback.wrong { background: #fde8e8; color: #b13a3a; border: 2px solid #ff7d6b; display: block; }

/* ============================================
   教師用設定モーダル
   ============================================ */
.teacher-modal {
  position: fixed;
  inset: 0;
  background: rgba(43, 43, 61, 0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
}

.teacher-modal.active { display: flex; }

.teacher-modal-inner {
  background: var(--bg-paper);
  border: 3px solid var(--line);
  border-radius: 16px;
  padding: 24px;
  max-width: 460px;
  width: 100%;
  box-shadow: var(--shadow-lg);
}

.teacher-modal-title {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 18px;
  margin-bottom: 16px;
  border-bottom: 3px solid var(--ink);
  padding-bottom: 8px;
}

.teacher-form-row {
  margin-bottom: 14px;
}

.teacher-form-row label {
  display: block;
  font-weight: 700;
  font-size: 13px;
  margin-bottom: 4px;
  color: var(--ink-soft);
}

.teacher-form-row input,
.teacher-form-row textarea {
  width: 100%;
  padding: 10px;
  border: 2px solid var(--line);
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 14px;
  background: white;
}

.teacher-form-row textarea { min-height: 70px; resize: vertical; }

.teacher-form-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 8px;
}

.reset-progress-btn {
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: 8px;
  padding: 6px 12px;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  margin-top: 4px;
}

/* ============================================
   トースト

/* ============================================
   状態管理 (LocalStorage)
   単元ごとに別キーで保存する設計
   キー: rika-navi-v2-{unit}
   最後に使った単元: rika-navi-last-unit
   ============================================ */
const STORAGE_PREFIX  = "rika-navi-v2-";
const LAST_UNIT_KEY   = "rika-navi-last-unit";
const LAST_CLASS_KEY  = "rika-navi-last-class";

// 単元名 → ストレージキー（記号・スペースを除去して安全なキーに）
function unitToKey(unit) {
  return STORAGE_PREFIX + (unit || "default").replace(/\s/g, "_");
}

function defaultState(unit, className) {
  return {
    className: className || "",
    unit:      unit      || "ものの燃え方",
    question:  "",
    statuses:  {},
    frameAnswers: {}
  };
}

// 指定した単元のデータを読み込む
function loadStateForUnit(unit, className) {
  try {
    const raw = localStorage.getItem(unitToKey(unit));
    if (!raw) return defaultState(unit, className);
    const saved = JSON.parse(raw);
    // classNameは「最後に使ったクラス」で上書き（単元をまたいで継続）
    saved.className = className || saved.className || "";
    return saved;
  } catch(e) {
    return defaultState(unit, className);
  }
}

// 現在のstateを保存（単元キーで保存 + 最後の単元・クラスも記録）
function saveState() {
  localStorage.setItem(unitToKey(state.unit), JSON.stringify(state));
  localStorage.setItem(LAST_UNIT_KEY,  state.unit      || "");
  localStorage.setItem(LAST_CLASS_KEY, state.className || "");
}

// 起動時：最後に使った単元を復元
function loadInitialState() {
  const lastUnit  = localStorage.getItem(LAST_UNIT_KEY)  || "ものの燃え方";
  const lastClass = localStorage.getItem(LAST_CLASS_KEY) || "";
  return loadStateForUnit(lastUnit, lastClass);
}

// 単元を切り替える（stateを新しい単元のデータで入れ替える）
function switchUnit(newUnit, newClass) {
  state = loadStateForUnit(newUnit, newClass || state.className);
  state.unit      = newUnit;
  if (newClass) state.className = newClass;
  saveState();
}

let state = loadInitialState();

/* ============================================
   URLパラメータ処理
   ?class=5年1組&unit=ものの燃え方&q=問題文
   パラメータが来たとき：
     - 単元が今と違う → その単元のデータに切り替え
     - 同じ単元 → classとquestionだけ更新
   ============================================ */
function applyUrlParams() {
  const params = new URLSearchParams(window.location.search);
  const cls  = params.get("class") || params.get("c")        || null;
  const unit = params.get("unit")  || params.get("u")        || null;
  const q    = params.get("q")     || params.get("question") || null;

  // パラメータが何もなければ何もしない（自学モード：最後の状態のまま）
  if (!cls && !unit && !q) return;

  // 単元が変わっていたら、その単元のデータに切り替える
  if (unit && unit !== state.unit) {
    switchUnit(unit, cls);
  } else {
    // 同じ単元内でclassやquestionだけ更新
    if (cls) state.className = cls;
  }

  // 問題文はURLパラメータを優先して上書き
  if (q) state.question = q;
  if (cls) state.className = cls;

  saveState();
}
applyUrlParams();

/* ============================================
   単元一覧取得（履歴タブで使用）
   ============================================ */
function listSavedUnits() {
  const units = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(STORAGE_PREFIX)) {
      try {
        const data = JSON.parse(localStorage.getItem(k));
        if (data && data.unit) units.push(data);
      } catch(e) {}
    }
  }
  return units.sort((a, b) => (a.unit > b.unit ? 1 : -1));
}

/* ============================================
   レンダリング
   ============================================ */
function renderToday() {
  const classRow = document.getElementById("classRow");
  const todayClass = document.getElementById("todayClass");
  if (state.className) {
    todayClass.textContent = state.className;
    classRow.style.display = "grid";
  } else {
    classRow.style.display = "none";
  }
  document.getElementById("todayUnit").textContent = state.unit || "(未設定)";
  document.getElementById("todayQuestion").textContent = state.question || "(未設定)";
}

function renderProgressBar() {
  const bar = document.getElementById("progressBar");
  bar.innerHTML = "";
  STEPS.forEach(s => {
    const dot = document.createElement("div");
    const status = state.statuses[s.id] || "todo";
    dot.className = "progress-dot " + status;
    dot.textContent = s.num;
    dot.title = s.title;
    dot.style.cursor = "pointer";
    dot.addEventListener("click", () => openDetail(s.id));
    bar.appendChild(dot);
  });
}

function renderSteps() {
  const grid = document.getElementById("stepsGrid");
  grid.innerHTML = "";
  STEPS.forEach(s => {
    const status = state.statuses[s.id] || "todo";
    const card = document.createElement("div");
    card.className = "step-card";
    card.setAttribute("data-step", s.num);
    card.innerHTML = `
      <div class="step-number">${s.num}</div>
      ${status !== "todo" ? `<div class="step-status ${status}">${status === "in-progress" ? "とりくみ中" : "おわった"}</div>` : ""}
      <span class="step-icon">${s.icon}</span>
      <div class="step-title">${s.title}</div>
      <div class="step-desc">${s.description}</div>
    `;
    card.addEventListener("click", () => openDetail(s.id));
    grid.appendChild(card);
  });
}

/* ============================================
   詳細パネル
   ============================================ */
const overlay = document.getElementById("detailOverlay");
const panel = document.getElementById("detailPanel");

function openDetail(stepId) {

  if (!step) return;

  const status = state.statuses[stepId] || "todo";
  const colorVar = `var(--c${step.num})`;
  panel.style.setProperty("--panel-color", colorVar);

  const frameAnswers = state.frameAnswers[stepId] || [];

  panel.innerHTML = `
    <button class="close-btn" id="closeDetailBtn">✕</button>
    <div class="detail-header" style="background:${colorVar}">
      <div class="detail-header-row">
        <div class="detail-icon">${step.icon}</div>
        <div>
          <div class="detail-step-num">STEP ${step.num}</div>
          <div class="detail-title">${step.title}</div>
          <div class="detail-teacher-word">先生のことば: ${step.teacherWord}</div>
        </div>
      </div>
    </div>
    <div class="detail-body">

      <div class="status-switcher" data-step-id="${stepId}">
        <button class="status-btn ${status==='todo'?'active':''}" data-status="todo">未着手</button>
        <button class="status-btn ${status==='in-progress'?'active':''}" data-status="in-progress">とりくみ中</button>
        <button class="status-btn ${status==='done'?'active':''}" data-status="done">おわった</button>
      </div>

      ${step.factCheck ? renderFactCheck(step) : ""}

      <div class="block">
        <div class="block-title"><span class="block-emoji">🤔</span> いま考えること</div>
        <ul class="thinking-list">
          ${step.thinking.map(t => `<li>${escapeHTML(t)}</li>`).join("")}
        </ul>
      </div>

      <div class="block">
        <div class="block-title"><span class="block-emoji">💡</span> 困ったときのヒント</div>
        <ul class="hint-list">
          ${step.hints.map(h => `<li>${escapeHTML(h)}</li>`).join("")}
        </ul>
      </div>

      <div class="block">
        <div class="block-title"><span class="block-emoji">✏️</span> 書き方の例 (入力して保存できるよ)</div>
        <div class="frame-list">
          ${step.frames.map((f, i) => `
            <div class="frame-item">
              <div class="frame-template">${escapeHTML(f)}</div>
              <textarea class="frame-input" data-step-id="${stepId}" data-frame-idx="${i}" placeholder="ここに自分のことばで書こう…">${escapeHTML(frameAnswers[i] || "")}</textarea>
            </div>
          `).join("")}
        </div>
        <div class="frame-actions">
          <button class="btn" id="resetFramesBtn">クリア</button>
          <button class="btn btn-copy" id="copyFramesBtn">📋 まとめてコピー</button>
          <button class="btn btn-primary" id="saveFramesBtn">💾 保存</button>
        </div>
        <div class="save-notice" id="saveNotice"></div>
      </div>

      <div class="block">
        <div class="block-title"><span class="block-emoji">🧰</span> 使えるツール</div>
        <div class="tool-list">
          ${step.tools.map(t => {
            const ready = !!t.url;
            const inner = `
              <span class="tool-status" style="${ready ? 'background: var(--c5); color: white;' : ''}">${ready ? '使う ▶' : '準備中'}</span>
              <div class="tool-name">${escapeHTML(t.name)}</div>
              <div class="tool-desc">${escapeHTML(t.desc)}</div>
            `;
            return ready
              ? `<a href="${escapeHTML(t.url)}" class="tool-card" style="text-decoration:none;color:inherit;display:block;cursor:pointer;" target="_blank">${inner}</a>`
              : `<div class="tool-card">${inner}</div>`;
          }).join("")}
        </div>
      </div>

    </div>
  `;

  // イベント登録
  panel.querySelector("#closeDetailBtn").addEventListener("click", closeDetail);

  panel.querySelectorAll(".status-btn").forEach(btn => {
    btn.addEventListener("click", e => {
      const newStatus = btn.dataset.status;
      state.statuses[stepId] = newStatus;
      saveState();
      panel.querySelectorAll(".status-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderProgressBar();
      renderSteps();
      toast(newStatus === "done" ? "🎉 おわった！" : newStatus === "in-progress" ? "🚀 とりくみ中にしたよ" : "未着手にもどしたよ");
    });
  });

  panel.querySelector("#saveFramesBtn").addEventListener("click", () => {
    const inputs = panel.querySelectorAll(".frame-input");
    const arr = [];
    inputs.forEach(inp => arr.push(inp.value));
    state.frameAnswers[stepId] = arr;
    saveState();
    document.getElementById("saveNotice").textContent = "✓ 保存しました";
    setTimeout(() => { document.getElementById("saveNotice").textContent = ""; }, 2000);
  });

  panel.querySelector("#resetFramesBtn").addEventListener("click", () => {
    if (!confirm("入力をクリアしますか？")) return;
    panel.querySelectorAll(".frame-input").forEach(inp => inp.value = "");
  });

  panel.querySelector("#copyFramesBtn").addEventListener("click", () => {
    const inputs = panel.querySelectorAll(".frame-input");
    const templates = step.frames;
    const lines = [];
    inputs.forEach((inp, i) => {
      const text = inp.value.trim();
      if (text) lines.push(text);
      else lines.push(templates[i]);
    });
    const result = `【${step.title}】\n${lines.join("\n")}`;
    navigator.clipboard.writeText(result).then(() => {
      toast("📋 コピーしたよ!");
    }).catch(() => {
      toast("コピーできませんでした");
    });
  });

  // factCheck機能の登録
  if (step.factCheck) {
    panel.querySelectorAll(".fact-quiz").forEach((quizEl, idx) => {
      const quiz = step.factCheckQuiz[idx];
      quizEl.querySelectorAll(".fact-btn").forEach(b => {
        b.addEventListener("click", () => {
          const chose = b.dataset.choice;
          const fb = quizEl.querySelector(".fact-feedback");
          if (chose === quiz.answer) {
            fb.className = "fact-feedback correct";
            fb.textContent = "⭕ せいかい! " + quiz.explainOK;
          } else {
            fb.className = "fact-feedback wrong";
            fb.textContent = "💡 もう一度! " + quiz.explainNG;
          }
        });
      });
    });
  }

  overlay.classList.add("active");
  document.body.style.overflow = "hidden";
}

function renderFactCheck(step) {
  return `
    <div class="fact-check">
      <div class="fact-check-title">🔎 けっか？ それとも 考察？</div>
      <div class="fact-check-desc">${escapeHTML(step.factCheckIntro)}</div>
      ${step.factCheckQuiz.map((q, i) => `
        <div class="fact-quiz">
          <div class="fact-quiz-text">${escapeHTML(q.text)}</div>
          <div class="fact-buttons">
            <button class="fact-btn fact" data-choice="fact">これは 結果</button>
            <button class="fact-btn opinion" data-choice="opinion">これは 考察</button>
          </div>
          <div class="fact-feedback"></div>
        </div>
      `).join("")}
    </div>
  `;
}

function closeDetail() {
  overlay.classList.remove("active");
  document.body.style.overflow = "";
}

overlay.addEventListener("click", (e) => {
  if (e.target === overlay) closeDetail();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && overlay.classList.contains("active")) closeDetail();
});

/* ---- URL生成 ---- */
function buildUrl(cls, unit, q) {
  const base = window.location.origin + window.location.pathname;
  const p = new URLSearchParams();
  if (cls)  p.set("class", cls);
  if (unit) p.set("unit",  unit);
  if (q)    p.set("q",     q);
  return `${base}?${p.toString()}`;
}

let currentGeneratedUrl = "";

document.getElementById("generateUrlBtn").addEventListener("click", () => {
  const cls  = document.getElementById("urlClassInput").value.trim();
  const unit = document.getElementById("urlUnitInput").value.trim();
  const q    = document.getElementById("urlQuestionInput").value.trim();
  if (!unit && !q) { toast("単元名か問題を入力してね"); return; }

  currentGeneratedUrl = buildUrl(cls, unit, q);
  document.getElementById("generatedUrl").textContent = currentGeneratedUrl;
  document.getElementById("copyUrlBtn").style.display   = "inline-flex";
  document.getElementById("showQrBtn").style.display    = "inline-flex";
  document.getElementById("saveToHistoryBtn").style.display = "inline-flex";
  document.getElementById("qrArea").style.display = "none";
  toast("🔗 URLを生成したよ！");
});

document.getElementById("copyUrlBtn").addEventListener("click", () => {
  navigator.clipboard.writeText(currentGeneratedUrl).then(() => toast("📋 URLをコピーしたよ！"));
});

/* ---- QRコード生成（ライブラリなしで自前実装・小規模URL向け） ---- */
document.getElementById("showQrBtn").addEventListener("click", () => {
  const area = document.getElementById("qrArea");
  area.style.display = "block";
  drawQR(currentGeneratedUrl);
  toast("📱 QRコードを表示したよ！");
});

// QRコード生成（qrcode-generatorライブラリをCDNから動的ロード）
function drawQR(url) {
  const canvas = document.getElementById("qrCanvas");
  // qrcode-generator を動的に読み込み
  if (window.qrcode) {
    _renderQR(url, canvas);
    return;
  }
  const script = document.createElement("script");
  script.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
  script.onload = () => {
    // qrcodejsはcanvasより divを使う方式
    const div = document.createElement("div");
    div.id = "_qrTmp";
    div.style.display = "none";
    document.body.appendChild(div);
    new QRCode(div, {
      text: url,
      width: 240,
      height: 240,
      colorDark: "#2b2b3d",
      colorLight: "#ffffff"
    });
    setTimeout(() => {
      const img = div.querySelector("img");
      if (img) {
        const ctx = canvas.getContext("2d");
        canvas.width = 240; canvas.height = 240;
        const i = new Image();
        i.onload = () => ctx.drawImage(i, 0, 0);
        i.src = img.src;
      } else {
        // canvasで直接描画されている場合
        const qrCanvas = div.querySelector("canvas");
        if (qrCanvas) {
          canvas.width = qrCanvas.width;
          canvas.height = qrCanvas.height;
          canvas.getContext("2d").drawImage(qrCanvas, 0, 0);
        }
      }
      document.body.removeChild(div);
    }, 200);
  };
  script.onerror = () => {
    // フォールバック：URLをそのままテキスト表示
    const ctx = canvas.getContext("2d");
    canvas.width = 300; canvas.height = 80;
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, 300, 80);
    ctx.fillStyle = "#2b2b3d";
    ctx.font = "11px sans-serif";
    ctx.fillText("QR生成失敗。URLをコピーして共有してください。", 8, 30);
    toast("QRコードの生成に失敗しました。URLをコピーして使ってね。");
  };
  document.head.appendChild(script);
}

/* ---- 履歴 ---- */
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); } catch(e) { return []; }
}
function saveHistory(h) { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); }

document.getElementById("saveToHistoryBtn").addEventListener("click", () => {
  const cls  = document.getElementById("urlClassInput").value.trim();
  const unit = document.getElementById("urlUnitInput").value.trim();
  const q    = document.getElementById("urlQuestionInput").value.trim();
  const h = loadHistory();
  h.unshift({ cls, unit, q, url: currentGeneratedUrl, date: new Date().toLocaleDateString("ja-JP") });
  if (h.length > 20) h.pop();
  saveHistory(h);
  toast("📋 履歴に保存したよ！");
});

function renderHistory() {
  const h = loadHistory();
  const wrap = document.getElementById("historyList");

  // 保存済み単元一覧も表示
  const savedUnits = listSavedUnits();
  const unitHtml = savedUnits.length ? `
    <div style="font-weight:900;font-size:13px;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--muted);">
      📚 保存済み単元（タップで切り替え）
    </div>
    ${savedUnits.map(u => `
      <div style="display:flex;align-items:center;gap:8px;background:${u.unit === state.unit ? '#fff8e0' : 'white'};border:2px solid ${u.unit === state.unit ? 'var(--accent)' : 'var(--muted)'};border-radius:10px;padding:8px 10px;margin-bottom:6px;">
        <div style="flex:1;min-width:0;">
          <div style="font-weight:900;font-size:13px;">${escapeHTML(u.className || "")} ${escapeHTML(u.unit)}</div>
          <div style="font-size:11px;color:var(--ink-soft);margin-top:1px;">
            進捗：${Object.values(u.statuses || {}).filter(s => s === "done").length}ステップ完了
            ${u.unit === state.unit ? ' ← 今ここ' : ''}
          </div>
        </div>
        <button class="btn btn-small switch-unit-btn" data-unit="${escapeHTML(u.unit)}" data-class="${escapeHTML(u.className || '')}"
          ${u.unit === state.unit ? 'style="opacity:0.4;cursor:default;"' : ''}>
          ${u.unit === state.unit ? '表示中' : '切替'}
        </button>
      </div>
    `).join("")}
    <div class="divider"></div>
    <div style="font-weight:900;font-size:13px;margin-bottom:8px;margin-top:12px;">🔗 URL履歴</div>
  ` : "";

  if (!h.length && !savedUnits.length) {
    wrap.innerHTML = '<div style="color:var(--ink-soft);text-align:center;padding:16px;font-size:13px;">まだ履歴がないよ</div>';
    return;
  }

  wrap.innerHTML = unitHtml + (h.length ? h.map((item, i) => `
    <div style="background:white;border:2px solid var(--muted);border-radius:10px;padding:10px;margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <div style="flex:1;min-width:0;">
          <div style="font-weight:900;font-size:13px;">${escapeHTML(item.cls || "")} ${escapeHTML(item.unit || "")}</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHTML(item.q || "")}</div>
          <div style="font-size:10px;color:var(--ink-soft);margin-top:2px;">${escapeHTML(item.date || "")}</div>
        </div>
        <div style="display:flex;gap:4px;flex-shrink:0;">
          <button class="btn btn-small" data-i="${i}" data-action="use">使う</button>
          <button class="btn btn-small" data-i="${i}" data-action="copy">📋</button>
          <button class="btn btn-small btn-danger" data-i="${i}" data-action="del">✕</button>
        </div>
      </div>
    </div>
  `).join("") : '<div style="color:var(--ink-soft);font-size:12px;text-align:center;padding:8px;">URL履歴はまだないよ</div>');

  // 単元切り替えボタン
  wrap.querySelectorAll(".switch-unit-btn").forEach(btn => {
    if (btn.dataset.unit === state.unit) return;
    btn.addEventListener("click", () => {
      switchUnit(btn.dataset.unit, btn.dataset.class || "");
      renderToday();
      renderProgressBar();
      renderSteps();
      teacherModal.classList.remove("active");
      toast(`📚 ${btn.dataset.unit} に切り替えたよ！`);
    });
  });

  // URL履歴ボタン
  wrap.querySelectorAll("button[data-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = parseInt(btn.dataset.i);
      const item = loadHistory()[i];
      if (btn.dataset.action === "use") {
        switchUnit(item.unit || state.unit, item.cls || "");
        state.question = item.q || state.question;
        saveState();
        renderToday();
        renderProgressBar();
        renderSteps();
        teacherModal.classList.remove("active");
        toast(`📚 ${item.cls || ""} ${item.unit || ""}を適用したよ！`);
      } else if (btn.dataset.action === "copy") {
        navigator.clipboard.writeText(item.url).then(() => toast("📋 URLをコピーしたよ！"));
      } else if (btn.dataset.action === "del") {
        const h = loadHistory();
        h.splice(i, 1);
        saveHistory(h);
        renderHistory();
      }
    });
  });
}

document.getElementById("clearHistoryBtn").addEventListener("click", () => {
  if (!confirm("履歴をすべて削除しますか？")) return;
  saveHistory([]);
  renderHistory();
  toast("🗑️ 履歴を削除しました");
});

/* ============================================
   ユーティリティ
   ============================================ */
function escapeHTML(s) {
  if (s == null) return "";
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}
