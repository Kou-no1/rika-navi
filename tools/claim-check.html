<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>証拠・理由・主張チェック ｜ 理科問題解決ナビ</title>
<link rel="stylesheet" href="../common.css">
<style>
.toulmin-diagram {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  grid-template-rows: auto auto auto;
  gap: 8px;
  align-items: center;
  margin: 10px 0;
}
.td-box {
  background: white;
  border: 3px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  box-shadow: var(--shadow-sm);
}
.td-box-title { font-family: var(--font-display); font-weight: 900; font-size: 13px; margin-bottom: 6px; }
.td-box textarea {
  width: 100%;
  border: 1.5px solid var(--muted);
  border-radius: 6px;
  padding: 6px;
  font-family: var(--font-body);
  font-size: 12px;
  min-height: 52px;
}
.td-arrow {
  font-size: 24px;
  text-align: center;
  font-weight: 900;
  color: var(--ink-soft);
}
.td-claim { grid-column: 1 / -1; background: linear-gradient(135deg, #fff 0%, #f0f4ff 100%); border-color: var(--c6); }
.td-claim .td-box-title { color: var(--c6); font-size: 15px; }
.td-backing { grid-column: 1; background: #fff8e0; }
.td-warrant { grid-column: 3; background: #e8f4ff; }
.td-rebuttal { grid-column: 1 / -1; background: #fff0f0; border-color: var(--c4); border-style: dashed; }

.strength-meter {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 14px;
}
.strength-item {
  flex: 1;
  min-width: 120px;
  padding: 8px;
  border-radius: 8px;
  border: 2px solid var(--muted);
  font-size: 12px;
  text-align: center;
  font-weight: 700;
}
.strength-item.strong { background: #e6f7ed; border-color: var(--c5); color: var(--ok); }
.strength-item.weak { background: #fde8e8; border-color: var(--c4); color: var(--ng); }
.strength-item.mid { background: #fff8e0; border-color: var(--accent); color: var(--warn); }
</style>
</head>
<body data-step="6" data-tool-id="claim-check" data-tool-title="証拠・理由・主張チェック" data-step-name="結果から考える">

<main>
  <div class="tool-intro">
    「<strong>証拠→理由→主張</strong>」の３つがそろうと、強い考察になるよ。<br>
    それぞれを書いて、考察の強さを確認しよう。
  </div>

  <div class="section">
    <div class="section-title"><span class="emoji">🗺️</span> 考察の地図</div>
    <div class="section-subtitle">３つのボックスを埋めよう</div>
    <div class="toulmin-diagram">
      <!-- 証拠 -->
      <div class="td-box td-backing">
        <div class="td-box-title" style="color:var(--warn);">📊 証拠（実験の結果）</div>
        <div style="font-size:11px;color:var(--ink-soft);margin-bottom:4px;">測ったこと・見えたこと</div>
        <textarea id="evidence" placeholder="例：ふたをしたびんの火は2分で消えた。"></textarea>
      </div>
      <div class="td-arrow">→</div>
      <!-- 根拠（なぜ言えるか） -->
      <div class="td-box td-warrant">
        <div class="td-box-title" style="color:var(--c1);">🔗 根拠（なぜ言える？）</div>
        <div style="font-size:11px;color:var(--ink-soft);margin-bottom:4px;">既習事項・一般的な知識</div>
        <textarea id="warrant" placeholder="例：空気がないと燃焼は起きないと学習した。"></textarea>
      </div>
      <!-- 矢印 -->
      <div style="grid-column:1/-1;text-align:center;font-size:20px;color:var(--ink-soft);">⬇️</div>
      <!-- 主張 -->
      <div class="td-box td-claim">
        <div class="td-box-title">💡 主張（だから何が言える？）</div>
        <div style="font-size:11px;color:var(--ink-soft);margin-bottom:4px;">考察の結論</div>
        <textarea id="claim" placeholder="例：ものが燃えるためには空気（酸素）が必要だ。"></textarea>
      </div>
      <!-- 反論（あれば） -->
      <div class="td-box td-rebuttal" style="margin-top:6px;">
        <div class="td-box-title" style="color:var(--c4);">⚠️ 反論・例外（あれば）</div>
        <div style="font-size:11px;color:var(--ink-soft);margin-bottom:4px;">この主張が当てはまらないかもしれない場合（なければ空白でOK）</div>
        <textarea id="rebuttal" placeholder="例：真空中での特殊な燃焼反応など例外もある。（小学校の学習では考えなくてよい）"></textarea>
      </div>
    </div>

    <div id="strengthArea"></div>

    <div class="btn-row">
      <button class="btn btn-copy" id="copyBtn">📋 コピー</button>
      <button class="btn btn-strong" id="saveBtn">💾 保存</button>
    </div>
    <div class="save-indicator" id="saveIndicator"></div>
  </div>

  <div class="section">
    <div class="section-title"><span class="emoji">📝</span> まとまった考察文</div>
    <div class="preview" id="preview"><div class="preview-empty">上に入力するとここに文が作られるよ</div></div>
  </div>
</main>

<script src="../common.js"></script>
<script>
const TOOL_ID = "claim-check";
const DEFAULT = { evidence: "", warrant: "", claim: "", rebuttal: "" };
let state = RikaNavi.load(TOOL_ID, DEFAULT);

function bind() {
  Object.keys(DEFAULT).forEach(k => {
    const el = document.getElementById(k);
    el.value = state[k] || "";
    el.addEventListener("input", () => { state[k] = el.value; update(); });
  });
}

function update() {
  const { evidence, warrant, claim, rebuttal } = state;
  const filled = [evidence, warrant, claim].map(v => v.trim());
  const filledCount = filled.filter(Boolean).length;

  // 強さ評価
  const items = [
    { label: "証拠がある", ok: !!evidence.trim() },
    { label: "根拠がある", ok: !!warrant.trim() },
    { label: "主張がある", ok: !!claim.trim() },
    { label: "反論も考えた", ok: !!rebuttal.trim() }
  ];
  document.getElementById("strengthArea").innerHTML = `
    <div class="strength-meter">
      ${items.map(item => `
        <div class="strength-item ${item.ok ? 'strong' : 'weak'}">
          ${item.ok ? '✅' : '⬜'} ${item.label}
        </div>
      `).join("")}
    </div>
    <div style="font-size:12px;color:var(--ink-soft);margin-top:8px;text-align:right;">
      考察の強さ：${"★".repeat(filledCount)}${"☆".repeat(3 - Math.min(filledCount,3))} （${filledCount}/3）
    </div>
  `;

  // 文生成
  const preview = document.getElementById("preview");
  if (!claim.trim() && !evidence.trim()) {
    preview.innerHTML = '<div class="preview-empty">上に入力するとここに文が作られるよ</div>';
    return;
  }
  let html = "";
  if (evidence.trim()) html += `<div><strong>証拠：</strong>${RikaNavi.escapeHTML(evidence)}</div>`;
  if (warrant.trim()) html += `<div style="margin-top:6px;"><strong>根拠：</strong>${RikaNavi.escapeHTML(warrant)}</div>`;
  if (claim.trim()) html += `<div style="margin-top:8px;font-weight:900;color:var(--c6);">∴ <strong>主張：</strong>${RikaNavi.escapeHTML(claim)}</div>`;
  if (rebuttal.trim()) html += `<div style="margin-top:6px;font-size:12px;color:var(--ink-soft);"><strong>ただし：</strong>${RikaNavi.escapeHTML(rebuttal)}</div>`;
  preview.innerHTML = html;
}

document.getElementById("saveBtn").addEventListener("click", () => {
  RikaNavi.save(TOOL_ID, state);
  const ind = document.getElementById("saveIndicator");
  ind.textContent = `✓ ${RikaNavi.getTeam()}のデータを保存しました`;
  setTimeout(() => ind.textContent = "", 2500);
});

document.getElementById("copyBtn").addEventListener("click", () => {
  RikaNavi.copy(document.getElementById("preview").innerText);
});

bind();
update();
</script>
</body>
</html>
