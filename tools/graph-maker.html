<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表・グラフ作成サポート ｜ 理科問題解決ナビ</title>
<link rel="stylesheet" href="../common.css">
<style>
.chart-type-btns { display: flex; gap: 8px; margin-bottom: 14px; }
.chart-type-btn {
  flex: 1;
  padding: 12px 8px;
  border: 3px solid var(--line);
  border-radius: 12px;
  background: var(--bg-paper);
  cursor: pointer;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 13px;
  box-shadow: var(--shadow-sm);
  text-align: center;
}
.chart-type-btn.active { background: var(--c5); color: white; text-shadow: 1px 1px 0 rgba(0,0,0,.2); }
.chart-icon { font-size: 24px; display: block; margin-bottom: 4px; }

.data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.data-row { display: flex; gap: 6px; align-items: center; }
.data-row input { flex: 1; }
.data-row .del-btn { width: 32px; height: 32px; border: 2px solid var(--line); background: var(--bg); border-radius: 6px; cursor: pointer; font-weight: 900; font-size: 12px; }

.canvas-wrap {
  background: white;
  border: 3px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  overflow-x: auto;
}
canvas { max-width: 100%; }
</style>
</head>
<body data-step="5" data-tool-id="graph-maker" data-tool-title="表・グラフ作成サポート" data-step-name="分かったことを整理する">

<main>
  <div class="tool-intro">
    実験の数値データを<strong>グラフ</strong>にして、結果を見やすくしよう。<br>
    折れ線グラフは「変化」、棒グラフは「量の比べ」に向いているよ。
  </div>

  <div class="section">
    <div class="section-title"><span class="emoji">📊</span> グラフの種類</div>
    <div class="chart-type-btns">
      <button class="chart-type-btn active" data-type="line"><span class="chart-icon">📈</span>折れ線グラフ<br><span style="font-size:10px;font-weight:500;">時間で変わるとき</span></button>
      <button class="chart-type-btn" data-type="bar"><span class="chart-icon">📊</span>棒グラフ<br><span style="font-size:10px;font-weight:500;">量を比べるとき</span></button>
    </div>
  </div>

  <div class="section">
    <div class="section-title"><span class="emoji">✏️</span> 軸のタイトル</div>
    <div class="field">
      <label class="field-label">グラフのタイトル</label>
      <input type="text" id="chartTitle" placeholder="例：水の温度変化">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div class="field">
        <label class="field-label">横軸（X軸）</label>
        <input type="text" id="xLabel" placeholder="例：時間（分）">
      </div>
      <div class="field">
        <label class="field-label">縦軸（Y軸）</label>
        <input type="text" id="yLabel" placeholder="例：温度（℃）">
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title"><span class="emoji">🔢</span> データを入力</div>
    <div class="section-subtitle">ラベルと数値を入れよう（最大10個）</div>
    <div id="dataRows"></div>
    <button class="add-row-btn" id="addDataBtn" style="margin-top:8px;border:2.5px dashed var(--ink-soft);background:transparent;padding:8px 16px;border-radius:10px;font-family:var(--font-body);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-soft);width:100%;">＋ データを追加</button>
  </div>

  <div class="section">
    <div class="section-title"><span class="emoji">📈</span> グラフ</div>
    <div class="canvas-wrap">
      <canvas id="chartCanvas" width="680" height="380"></canvas>
    </div>
    <div class="btn-row">
      <button class="btn btn-strong" id="drawBtn">🔄 グラフを更新</button>
      <button class="btn btn-copy" id="saveImgBtn">📷 画像で保存</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title"><span class="emoji">💬</span> このグラフから分かること</div>
    <div class="field-help">グラフを見て、事実として分かることを書こう（考察はStep6で！）</div>
    <textarea id="insight" placeholder="例：時間が経つにつれて温度は上がり続け、10分後に100℃に達した。"></textarea>
    <div class="btn-row">
      <button class="btn btn-strong" id="saveBtn">💾 保存</button>
    </div>
    <div class="save-indicator" id="saveIndicator"></div>
  </div>
</main>

<script src="../common.js"></script>
<script>
const TOOL_ID = "graph-maker";
const COLORS = ["#5BA8E8","#FF6B6B","#5FCB8B","#B57AE0","#FF9D4D","#FF85B5","#4A6FB8","#6CCED0","#ffd84d","#9e9e9e"];
const DEFAULT = {
  chartType: "line",
  chartTitle: "",
  xLabel: "",
  yLabel: "",
  dataPoints: [
    { label: "1", value: "" },
    { label: "2", value: "" },
    { label: "3", value: "" }
  ],
  insight: ""
};

let state = RikaNavi.load(TOOL_ID, DEFAULT);
if (!state.dataPoints) state.dataPoints = DEFAULT.dataPoints.slice();

function renderTypeButtons() {
  document.querySelectorAll(".chart-type-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.type === state.chartType);
    b.addEventListener("click", () => {
      state.chartType = b.dataset.type;
      renderTypeButtons();
      drawChart();
    });
  });
}

function bindTextFields() {
  ["chartTitle","xLabel","yLabel"].forEach(id => {
    const el = document.getElementById(id);
    el.value = state[id] || "";
    el.addEventListener("input", () => { state[id] = el.value; });
  });
  const ins = document.getElementById("insight");
  ins.value = state.insight || "";
  ins.addEventListener("input", () => { state.insight = ins.value; });
}

function renderDataRows() {
  const wrap = document.getElementById("dataRows");
  wrap.innerHTML = state.dataPoints.map((dp, i) => `
    <div class="data-row" style="margin-bottom:6px;">
      <input type="text" placeholder="ラベル（例：1分後）" data-i="${i}" data-f="label" value="${RikaNavi.escapeHTML(dp.label)}" style="flex:1.2;">
      <input type="number" placeholder="数値" data-i="${i}" data-f="value" value="${dp.value}" style="flex:1;">
      <button class="del-btn" data-i="${i}">✕</button>
    </div>
  `).join("");

  wrap.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", () => {
      const i = parseInt(inp.dataset.i);
      state.dataPoints[i][inp.dataset.f] = inp.value;
    });
  });
  wrap.querySelectorAll(".del-btn").forEach(b => {
    b.addEventListener("click", () => {
      state.dataPoints.splice(parseInt(b.dataset.i), 1);
      if (state.dataPoints.length === 0) state.dataPoints.push({ label: "", value: "" });
      renderDataRows();
    });
  });
}

document.getElementById("addDataBtn").addEventListener("click", () => {
  if (state.dataPoints.length >= 10) { RikaNavi.toast("データは最大10個だよ"); return; }
  state.dataPoints.push({ label: "", value: "" });
  renderDataRows();
});

function drawChart() {
  const canvas = document.getElementById("chartCanvas");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const PAD = { top: 50, right: 30, bottom: 70, left: 70 };
  const pw = W - PAD.left - PAD.right;
  const ph = H - PAD.top - PAD.bottom;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, W, H);

  const valid = state.dataPoints.filter(d => d.label && d.value !== "");
  if (valid.length < 2) {
    ctx.fillStyle = "#aaa";
    ctx.font = "16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("データを2つ以上入力してグラフを表示", W/2, H/2);
    return;
  }

  const values = valid.map(d => parseFloat(d.value));
  const maxVal = Math.max(...values, 0);
  const minVal = Math.min(...values, 0);
  const range = maxVal - minVal || 1;
  const yMax = maxVal + range * 0.15;
  const yMin = minVal - range * 0.1;
  const yRange = yMax - yMin;

  // グリッド・軸
  ctx.strokeStyle = "#e0e0e0";
  ctx.lineWidth = 1;
  const gridCount = 5;
  for (let i = 0; i <= gridCount; i++) {
    const y = PAD.top + ph - (i / gridCount) * ph;
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + pw, y); ctx.stroke();
    ctx.fillStyle = "#666";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "right";
    const val = yMin + (yRange * i / gridCount);
    ctx.fillText(val.toFixed(1), PAD.left - 6, y + 4);
  }

  // 軸
  ctx.strokeStyle = "#2b2b3d";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(PAD.left, PAD.top);
  ctx.lineTo(PAD.left, PAD.top + ph);
  ctx.lineTo(PAD.left + pw, PAD.top + ph);
  ctx.stroke();

  // タイトル
  if (state.chartTitle) {
    ctx.fillStyle = "#2b2b3d";
    ctx.font = "bold 15px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(state.chartTitle, W/2, 28);
  }
  // 軸ラベル
  if (state.xLabel) {
    ctx.fillStyle = "#5a5a72";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(state.xLabel, PAD.left + pw/2, H - 8);
  }
  if (state.yLabel) {
    ctx.save();
    ctx.translate(16, PAD.top + ph/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillStyle = "#5a5a72";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(state.yLabel, 0, 0);
    ctx.restore();
  }

  // データ
  const xStep = pw / (valid.length - 1 || 1);
  const toX = i => PAD.left + i * xStep;
  const toY = v => PAD.top + ph - ((v - yMin) / yRange) * ph;

  if (state.chartType === "bar") {
    const barW = Math.min(xStep * 0.6, 60);
    valid.forEach((d, i) => {
      const x = toX(i) - barW/2;
      const y0 = toY(0);
      const y1 = toY(parseFloat(d.value));
      ctx.fillStyle = COLORS[i % COLORS.length];
      ctx.strokeStyle = "#2b2b3d";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, Math.min(y0,y1), barW, Math.abs(y0-y1), 4);
      ctx.fill();
      ctx.stroke();
    });
  } else {
    // 折れ線
    ctx.strokeStyle = COLORS[0];
    ctx.lineWidth = 3;
    ctx.lineJoin = "round";
    ctx.beginPath();
    valid.forEach((d, i) => {
      const x = toX(i), y = toY(parseFloat(d.value));
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    // 点
    valid.forEach((d, i) => {
      const x = toX(i), y = toY(parseFloat(d.value));
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI*2);
      ctx.fillStyle = "white";
      ctx.fill();
      ctx.strokeStyle = COLORS[0];
      ctx.lineWidth = 3;
      ctx.stroke();
      // 値ラベル
      ctx.fillStyle = "#2b2b3d";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(d.value, x, y - 12);
    });
  }

  // X軸ラベル
  valid.forEach((d, i) => {
    const x = toX(i);
    ctx.fillStyle = "#2b2b3d";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(d.label, x, PAD.top + ph + 18);
  });
}

document.getElementById("drawBtn").addEventListener("click", () => {
  drawChart();
  RikaNavi.toast("📊 グラフを更新したよ！");
});

document.getElementById("saveImgBtn").addEventListener("click", () => {
  drawChart();
  const canvas = document.getElementById("chartCanvas");
  const link = document.createElement("a");
  link.download = `graph-${RikaNavi.getTeam()}.png`;
  link.href = canvas.toDataURL();
  link.click();
  RikaNavi.toast("📷 画像を保存したよ！");
});

document.getElementById("saveBtn").addEventListener("click", () => {
  RikaNavi.save(TOOL_ID, state);
  const ind = document.getElementById("saveIndicator");
  ind.textContent = `✓ ${RikaNavi.getTeam()}のデータを保存しました`;
  setTimeout(() => ind.textContent = "", 2500);
});

renderTypeButtons();
bindTextFields();
renderDataRows();
drawChart();
</script>
</body>
</html>
