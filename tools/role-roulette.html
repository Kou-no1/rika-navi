<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>役割ルーレット ｜ 理科問題解決ナビ</title>
<link rel="stylesheet" href="../common.css">
<style>
.roulette-stage {
  text-align: center;
  padding: 30px 20px;
  background: white;
  border: 3px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow-md);
}
#wheel-wrap { position: relative; display: inline-block; margin: 20px 0; }
#wheel {
  transition: transform 4s cubic-bezier(0.17, 0.67, 0.13, 1);
  filter: drop-shadow(4px 4px 0 var(--line));
}
.wheel-pointer {
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 38px;
  z-index: 2;
  filter: drop-shadow(2px 2px 0 var(--line));
}
.spin-btn {
  background: var(--accent);
  border: 3px solid var(--line);
  border-radius: 30px;
  padding: 14px 30px;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 18px;
  cursor: pointer;
  box-shadow: var(--shadow-md);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.spin-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.spin-btn:not(:disabled):hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--line); }

.member-list { display: flex; flex-direction: column; gap: 6px; }
.member-row { display: flex; gap: 6px; align-items: center; }
.member-row input { flex: 1; }
.member-row .remove-btn { width:36px; height:36px; border:2.5px solid var(--line); background:var(--bg); border-radius:8px; cursor:pointer; font-weight:900; box-shadow:var(--shadow-sm); }

.result-table { width: 100%; border-collapse: collapse; margin-top: 14px; }
.result-table th, .result-table td { border: 2.5px solid var(--line); padding: 8px 12px; font-size: 14px; }
.result-table th { background: var(--c3); color: white; text-shadow: 1px 1px 0 rgba(0,0,0,0.2); font-family: var(--font-display); }

.result-display {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 22px;
  margin-top: 20px;
  padding: 12px 20px;
  background: var(--accent);
  border: 3px solid var(--line);
  border-radius: 14px;
  display: inline-block;
  box-shadow: var(--shadow-md);
  min-height: 1em;
}
</style>
</head>
<body data-step="3" data-tool-id="role-roulette" data-tool-title="役割ルーレット" data-step-name="どうやって調べる？">

<main>
  <div class="tool-intro">
    実験の役割を決めよう。<strong>ルーレット</strong>で公平に、または<strong>くじびき</strong>で全員に役割を割りふれるよ。
  </div>

  <div class="section">
    <div class="section-title"><span class="emoji">👥</span> 班のメンバー</div>
    <div class="member-list" id="memberList"></div>
    <button class="add-btn" id="addMemberBtn" style="margin-top:8px;border:2.5px dashed var(--ink-soft);background:transparent;padding:8px 16px;border-radius:10px;font-family:var(--font-body);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-soft);width:100%;">+ メンバーを追加</button>
  </div>

  <div class="section">
    <div class="section-title"><span class="emoji">🎭</span> 役割</div>
    <div class="field-help">使う役割を選ぼう。クリックでON/OFF</div>
    <div id="roleChoices" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
  </div>

  <div class="section">
    <div class="section-title"><span class="emoji">🎰</span> ルーレットを回そう</div>
    <div class="roulette-stage">
      <div id="wheel-wrap">
        <div class="wheel-pointer">▼</div>
        <svg id="wheel" width="280" height="280" viewBox="0 0 280 280"></svg>
      </div>
      <div><button class="spin-btn" id="spinBtn">🎲 ルーレットを回す</button></div>
      <div class="result-display" id="resultDisplay">役割を決めよう!</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title"><span class="emoji">📋</span> 全員に役割を割りふる</div>
    <div class="field-help">「くじびき」でメンバー全員にランダムに役割を分ける</div>
    <button class="btn btn-strong btn-block" id="assignAllBtn">🎲 全員に役割を割りふる</button>
    <div id="assignResult"></div>
  </div>
</main>

<script src="../common.js"></script>
<script>
const ROLES_ALL = [
  "実験リーダー", "記録係", "道具係", "時間係", "発表係", "安全確認係", "観察係", "片付け係"
];

const TOOL_ID = "role-roulette";
const DEFAULT = {
  members: ["", "", "", ""],
  roles: ["実験リーダー", "記録係", "道具係", "発表係"],
  lastResult: "",
  assignment: []
};
let state = RikaNavi.load(TOOL_ID, DEFAULT);
if (!Array.isArray(state.members)) state.members = DEFAULT.members.slice();
if (!Array.isArray(state.roles)) state.roles = DEFAULT.roles.slice();

function renderMembers() {
  const wrap = document.getElementById("memberList");
  wrap.innerHTML = state.members.map((m, i) => `
    <div class="member-row">
      <input type="text" data-i="${i}" value="${RikaNavi.escapeHTML(m)}" placeholder="${i+1}人目の名前">
      <button class="remove-btn" data-i="${i}">✕</button>
    </div>
  `).join("");
  wrap.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", () => {
      state.members[parseInt(inp.dataset.i)] = inp.value;
      RikaNavi.save(TOOL_ID, state);
    });
  });
  wrap.querySelectorAll(".remove-btn").forEach(b => {
    b.addEventListener("click", () => {
      state.members.splice(parseInt(b.dataset.i), 1);
      if (state.members.length === 0) state.members.push("");
      RikaNavi.save(TOOL_ID, state);
      renderMembers();
    });
  });
}

function renderRoles() {
  const wrap = document.getElementById("roleChoices");
  wrap.innerHTML = ROLES_ALL.map(r => {
    const active = state.roles.includes(r);
    return `<button class="role-chip" data-r="${r}" style="
      padding:8px 14px;
      border:2.5px solid var(--line);
      border-radius:20px;
      background:${active ? 'var(--c3)' : 'var(--bg-paper)'};
      color:${active ? 'white' : 'var(--ink)'};
      ${active ? 'text-shadow:1px 1px 0 rgba(0,0,0,0.2);' : ''}
      font-family:var(--font-body);
      font-weight:700;
      font-size:13px;
      cursor:pointer;
      box-shadow:var(--shadow-sm);
    ">${r}</button>`;
  }).join("");
  wrap.querySelectorAll(".role-chip").forEach(b => {
    b.addEventListener("click", () => {
      const r = b.dataset.r;
      const i = state.roles.indexOf(r);
      if (i >= 0) state.roles.splice(i, 1);
      else state.roles.push(r);
      RikaNavi.save(TOOL_ID, state);
      renderRoles();
      drawWheel();
    });
  });
}

function drawWheel() {
  const svg = document.getElementById("wheel");
  const cx = 140, cy = 140, r = 130;
  const roles = state.roles;
  if (roles.length === 0) {
    svg.innerHTML = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#eee" stroke="#2b2b3d" stroke-width="3"/>
      <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#5a5a72">役割を選んでね</text>`;
    return;
  }
  const colors = ["#5BA8E8","#B57AE0","#FF9D4D","#FF6B6B","#5FCB8B","#FF85B5","#6CCED0","#ffd84d"];
  const step = (2 * Math.PI) / roles.length;
  let paths = "";
  roles.forEach((role, i) => {
    const a0 = -Math.PI/2 + i * step;
    const a1 = a0 + step;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const large = step > Math.PI ? 1 : 0;
    const color = colors[i % colors.length];
    paths += `<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} Z" fill="${color}" stroke="#2b2b3d" stroke-width="3"/>`;
    // テキスト
    const ta = a0 + step/2;
    const tx = cx + (r * 0.65) * Math.cos(ta);
    const ty = cy + (r * 0.65) * Math.sin(ta);
    const angleDeg = (ta * 180 / Math.PI);
    paths += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="900" fill="white" style="text-shadow:1px 1px 0 #2b2b3d;" transform="rotate(${angleDeg + 90}, ${tx}, ${ty})">${role}</text>`;
  });
  paths += `<circle cx="${cx}" cy="${cy}" r="14" fill="#2b2b3d"/>`;
  svg.innerHTML = paths;
}

let currentRotation = 0;
document.getElementById("spinBtn").addEventListener("click", () => {
  const roles = state.roles;
  if (roles.length === 0) {
    RikaNavi.toast("役割を選んでね");
    return;
  }
  const btn = document.getElementById("spinBtn");
  btn.disabled = true;
  const winnerIdx = Math.floor(Math.random() * roles.length);
  const step = 360 / roles.length;
  // 当たりの中央を上(0°)に持ってくる回転角
  const targetAngle = - (winnerIdx * step + step/2);
  // たくさん回す
  const turns = 5 + Math.random() * 3;
  currentRotation += 360 * turns + (targetAngle - (currentRotation % 360));
  const wheel = document.getElementById("wheel");
  wheel.style.transform = `rotate(${currentRotation}deg)`;
  document.getElementById("resultDisplay").textContent = "✨ 回転中...";
  setTimeout(() => {
    const winner = roles[winnerIdx];
    document.getElementById("resultDisplay").textContent = `🎉 ${winner}!`;
    state.lastResult = winner;
    RikaNavi.save(TOOL_ID, state);
    btn.disabled = false;
  }, 4200);
});

document.getElementById("addMemberBtn").addEventListener("click", () => {
  state.members.push("");
  RikaNavi.save(TOOL_ID, state);
  renderMembers();
});

document.getElementById("assignAllBtn").addEventListener("click", () => {
  const members = state.members.filter(m => m.trim());
  if (members.length === 0) { RikaNavi.toast("メンバー名を入れてね"); return; }
  if (state.roles.length === 0) { RikaNavi.toast("役割を選んでね"); return; }
  // シャッフル
  const shuffled = [...state.roles].sort(() => Math.random() - 0.5);
  const assignment = members.map((m, i) => ({ member: m, role: shuffled[i % shuffled.length] }));
  state.assignment = assignment;
  RikaNavi.save(TOOL_ID, state);
  renderAssignment();
  RikaNavi.toast("🎉 全員に役割を割りふったよ！");
});

function renderAssignment() {
  if (!state.assignment || state.assignment.length === 0) {
    document.getElementById("assignResult").innerHTML = "";
    return;
  }
  document.getElementById("assignResult").innerHTML = `
    <table class="result-table">
      <thead><tr><th>名前</th><th>役割</th></tr></thead>
      <tbody>
        ${state.assignment.map(a => `
          <tr><td>${RikaNavi.escapeHTML(a.member)}</td><td><strong>${RikaNavi.escapeHTML(a.role)}</strong></td></tr>
        `).join("")}
      </tbody>
    </table>
    <button class="btn btn-copy btn-small" style="margin-top:10px;" onclick="copyAssignment()">📋 結果をコピー</button>
  `;
}

window.copyAssignment = function() {
  const text = state.assignment.map(a => `${a.member}：${a.role}`).join("\n");
  RikaNavi.copy("【役割分担】\n" + text);
};

renderMembers();
renderRoles();
drawWheel();
renderAssignment();
</script>
</body>
</html>
